name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git \
            openssh-client openssh-server systemd python3
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy,rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test
      - name: End-to-end (ssh <-> simulated BLE <-> sshd -i)
        run: |
          mkdir -p /run/sshd
          cargo build
          tests/e2e-loopback.sh target/debug/ble-term-loopback

  # Licences, sources, duplicate crates and RustSec advisories (deny.toml);
  # the fuzz crate has its own lock file.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny
        run: cargo deny check
      - name: Advisories of the fuzz crate
        run: cargo deny --manifest-path tests/fuzz/Cargo.toml check advisories

  # 30 s per fuzz target from the seeds: catches regressions early; long
  # runs are made on request (docs/testing.md).
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz each target for 30 s
        run: |
          for t in $(cargo +nightly fuzz list --fuzz-dir tests/fuzz); do
            mkdir -p "tests/fuzz/corpus/$t"
            seeds=
            [ -d "tests/fuzz/seeds/$t" ] && seeds="tests/fuzz/seeds/$t"
            # The prebuilt cargo-fuzz is a musl binary and defaults to its
            # own target, which the sanitizer does not support.
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu --fuzz-dir tests/fuzz \
                "$t" "tests/fuzz/corpus/$t" $seeds -- -max_total_time=30
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: tests/fuzz/artifacts

  deb:
    runs-on: ubuntu-latest
    container: debian:bookworm
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            gcc: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            cc: aarch64-linux-gnu-gcc
          - target: x86_64-unknown-linux-gnu
            gcc: gcc
            cc: gcc
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git ${{ matrix.gcc }}
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --target ${{ matrix.target }}
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Package version
        run: ci/deb-version.sh >> "$GITHUB_ENV"
      - name: Build package
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: |
          cargo deb --target ${{ matrix.target }} --deb-version "$DEB_VERSION"
          dpkg-deb -f target/${{ matrix.target }}/debian/*.deb Package Version Architecture
      - uses: actions/upload-artifact@v4
        with:
          name: ble-term-${{ matrix.target }}
          path: target/${{ matrix.target }}/debian/*.deb

  # The amd64 package installed in a clean Debian: BLE sessions get the
  # system SSH server's configuration, purge leaves nothing behind.
  package:
    needs: deb
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ['debian:bookworm', 'debian:trixie']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ble-term-x86_64-unknown-linux-gnu
          path: dist
      - name: Install and check
        run: |
          apt-get update
          tests/e2e-package.sh dist/*.deb

  # 32-bit Raspberry Pi OS. The ARMv6 target covers every Pi including
  # Pi Zero (W) and Pi 1. Debian's armhf cross toolchain is ARMv7-only and
  # the cross-rs images ship a glibc too old for current Rust std, so this
  # links with zig against glibc 2.31 (Bullseye and later) and runs the unit
  # tests on an emulated ARM1176 with Raspbian's ARMv6 libc.
  deb-armhf:
    runs-on: ubuntu-latest
    env:
      TARGET: arm-unknown-linux-gnueabihf
      GLIBC: '2.31'
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          pip install ziglang
          rustup target add "$TARGET"
          cargo install cargo-zigbuild cargo-deb --locked
      - name: Raspbian libc for the emulator
        run: |
          base=http://raspbian.raspberrypi.com/raspbian
          curl -sSf "$base/dists/bookworm/main/binary-armhf/Packages.xz" | xz -d > Packages
          mkdir -p sysroot
          for pkg in libc6 libgcc-s1; do
            deb=$(awk -v pkg="$pkg" '$0 == "Package: " pkg {p=1} p && /^Filename:/ {print $2; exit}' Packages)
            curl -sSfLo "$pkg.deb" "$base/$deb"
            dpkg-deb -x "$pkg.deb" sysroot
          done
          echo "QEMU_LD_PREFIX=$PWD/sysroot" >> "$GITHUB_ENV"
      - name: Unit tests on an emulated ARMv6 CPU (ARM1176, as in Pi Zero / Pi 1)
        env:
          QEMU_CPU: arm1176
        run: |
          tests=$(cargo zigbuild --lib --tests --target "$TARGET.$GLIBC" --message-format=json |
            jq -r 'select(.profile.test == true) | .executable // empty')
          for t in $tests; do qemu-arm "$t"; done
      - name: Build
        run: cargo zigbuild --release --target "$TARGET.$GLIBC" --bins
      - name: Check that the binaries are ARMv6 and run on an ARM1176
        env:
          QEMU_CPU: arm1176
        run: |
          for b in ble-term-daemon ble-term-session ble-term-connect; do
            f=target/$TARGET/release/$b
            readelf -A "$f" | grep 'Tag_CPU_arch:'
            readelf -A "$f" | grep -q 'Tag_CPU_arch: v6$'
            qemu-arm "$f" --version
          done
      - name: Package version
        run: ci/deb-version.sh >> "$GITHUB_ENV"
      - name: Build package
        run: |
          cargo deb --target "$TARGET" --no-build --deb-version "$DEB_VERSION"
          dpkg-deb -f target/$TARGET/debian/*.deb Package Version Architecture
      - uses: actions/upload-artifact@v4
        with:
          name: ble-term-${{ env.TARGET }}
          path: target/${{ env.TARGET }}/debian/*.deb

  # A tag vX.Y.Z publishes a GitHub release with the packages, SHA256SUMS and
  # the commit subjects since the previous tag.
  release:
    if: github.ref_type == 'tag'
    needs: [test, deps, fuzz-smoke, deb, deb-armhf, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ble-term-*
          merge-multiple: true
          path: dist
      - name: Checksums and notes
        run: |
          cd dist
          sha256sum *.deb > SHA256SUMS
          cat SHA256SUMS
          cd ..
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          # docs/releases/<tag>.md, if present, comes first: what users
          # must know when upgrading.
          if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then
            cat "docs/releases/$GITHUB_REF_NAME.md"
            printf '\n**Commits**\n\n'
          fi > notes.md
          git log --no-merges --format='- %s' ${prev:+"$prev.."}"$GITHUB_REF_NAME" >> notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "ble-term ${GITHUB_REF_NAME#v}" --notes-file notes.md
