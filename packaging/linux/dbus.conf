<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  The server (`blessh server run`, user _blessh) may only make the BlueZ calls it needs.
  BlueZ's own policy lets every local user (or group bluetooth) call any
  BlueZ method, e.g. pair and trust a keyboard; rules for a user override
  those. Replies to BlueZ's calls into the daemon (AcquireWrite, ...) are
  requested replies and stay allowed.
-->
<busconfig>
  <policy user="_blessh">
    <deny send_destination="org.bluez"/>
    <allow send_destination="org.bluez"
           send_interface="org.freedesktop.DBus.ObjectManager" send_member="GetManagedObjects"/>
    <allow send_destination="org.bluez"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.bluez"
           send_interface="org.bluez.GattManager1" send_member="RegisterApplication"/>
    <allow send_destination="org.bluez"
           send_interface="org.bluez.GattManager1" send_member="UnregisterApplication"/>
    <allow send_destination="org.bluez"
           send_interface="org.bluez.LEAdvertisingManager1" send_member="RegisterAdvertisement"/>
    <allow send_destination="org.bluez"
           send_interface="org.bluez.LEAdvertisingManager1" send_member="UnregisterAdvertisement"/>
    <allow send_destination="org.bluez"
           send_interface="org.bluez.Device1" send_member="Disconnect"/>
  </policy>
</busconfig>
