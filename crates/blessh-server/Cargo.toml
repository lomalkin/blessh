[package]
name = "blessh-server"
description = "SSH sessions over Bluetooth Low Energy: server, run as `blessh server`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "blessh_server"
path = "src/lib.rs"

[dependencies]
blessh-core = { workspace = true }
blessh-ble = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
name = "blessh-server"
maintainer = "Aluminique"
copyright = "2026, Aluminique"
license-file = ["../../LICENSE", "0"]
extended-description = """\
blessh exposes an SSH server over Bluetooth Low Energy. An unprivileged \
daemon (`blessh server run`, from the blessh-client package) registers a GATT service with BlueZ over D-Bus, listens on an L2CAP \
connection-oriented channel and forwards each BLE session to a per-session \
`sshd -i` started by systemd socket activation. No changes to the BlueZ \
configuration are made and the adapter is not taken over, so other Bluetooth \
services keep working. With BlueZ before 5.67 the kernel's ECRED L2CAP mode \
is turned off while installed, which keeps EATT off as in later BlueZ \
versions."""
depends = "blessh-client (>= 0.2.0~), bluez (>= 5.55), openssh-server, systemd"
conflicts = "ble-term"
replaces = "ble-term"
section = "net"
priority = "optional"
maintainer-scripts = "../../packaging/linux/debian/"
conf-files = ["/etc/blessh/sshd_config", "/etc/default/blessh"]
assets = [
    ["../../packaging/linux/eatt-off", "usr/lib/blessh/", "755"],
    ["../../packaging/linux/sshd_config", "etc/blessh/sshd_config", "644"],
    ["../../packaging/linux/default", "etc/default/blessh", "644"],
    ["../../packaging/linux/systemd/blessh-server.service", "usr/lib/systemd/system/", "644"],
    ["../../packaging/linux/systemd/blessh-session.socket", "usr/lib/systemd/system/", "644"],
    ["../../packaging/linux/systemd/blessh-session@.service", "usr/lib/systemd/system/", "644"],
    ["../../packaging/linux/sysusers.conf", "usr/lib/sysusers.d/blessh.conf", "644"],
    ["../../packaging/linux/dbus.conf", "usr/share/dbus-1/system.d/blessh.conf", "644"],
    ["../../README.md", "usr/share/doc/blessh-server/", "644"],
    ["../../docs/protocol.md", "usr/share/doc/blessh-server/", "644"],
]
