[package]
name = "blessh-client"
description = "SSH sessions over Bluetooth Low Energy: desktop client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "blessh"
path = "src/main.rs"

[dependencies]
blessh-core = { workspace = true }
blessh-ble = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
name = "blessh-client"
maintainer = "Aluminique"
copyright = "2026, Aluminique"
license-file = ["../../LICENSE", "0"]
extended-description = """\
blessh connects to a blessh server over Bluetooth Low Energy and runs the \
system ssh through it: `blessh user@server` with the server's advertised \
name or Bluetooth address. It needs BlueZ; no pairing is involved, the SSH \
host key and login provide the security."""
depends = "bluez (>= 5.55), openssh-client"
section = "net"
priority = "optional"
assets = [
    ["target/release/blessh", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/blessh-client/", "644"],
]
