[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.79"
license = "BSD-2-Clause"
publish = false

[workspace.dependencies]
blessh-core = { path = "crates/blessh-core" }
blessh-ble = { path = "crates/blessh-ble" }
blessh-server = { path = "crates/blessh-server" }
bluer = { version = "0.17.4", features = ["bluetoothd", "l2cap"] }
# Build libdbus from source so the binaries need neither libdbus-1-dev at build
# time nor a matching libdbus at run time (simplifies cross-compilation).
libdbus-sys = { version = "0.2.7", features = ["vendored"] }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "io-std", "time", "signal", "process", "sync", "fs"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
uuid = "1"
libc = "0.2"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(fuzzing)"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
