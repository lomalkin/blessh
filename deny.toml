# cargo deny check: known vulnerabilities, licenses, duplicate crates and
# crate sources of the dependency tree.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# The binaries are BSD-2-Clause; everything they link must be compatible.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
